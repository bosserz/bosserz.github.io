<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Restaurants, cafés and sights for the Shanghai trip, on accurate AMap tiles." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Shanghai Trip Map</title>
</head>
<body>
  <div id="map" role="application" aria-label="Map of places"></div>

  <header class="top">
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search places (English or 中文)" autocomplete="off" enterkeyhint="search" aria-label="Search places" />
      <button id="search-clear" class="search__clear" type="button" aria-label="Clear search" hidden>✕</button>
      <ul id="results" class="results" hidden></ul>
    </div>
    <nav class="chips" aria-label="Filters">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="chip chip--food" type="button" data-filter="food" aria-pressed="false">Food</button>
      <button class="chip chip--cafe" type="button" data-filter="cafe" aria-pressed="false">Café</button>
      <button class="chip chip--sight" type="button" data-filter="sight" aria-pressed="false">Sights</button>
      <button class="chip" type="button" id="chip-notvisited" aria-pressed="false">Not visited</button>
    </nav>
    <nav id="days" class="chips chips--days" aria-label="Itinerary day"></nav>
    <button id="daybanner" class="daybanner" type="button" hidden aria-controls="list" aria-expanded="false">
      <span class="daybanner__text"><span id="daybanner-title"></span><span id="daybanner-meta" class="daybanner__meta"></span></span>
      <span id="daybanner-cta" class="daybanner__cta">Timeline ›</span>
    </button>
    <div id="unplaced" class="unplaced" hidden>
      <button id="unplaced-toggle" class="unplaced__toggle" type="button" aria-expanded="false" aria-controls="unplaced-list"></button>
      <ul id="unplaced-list" class="unplaced__list" hidden></ul>
    </div>
  </header>

  <div class="fabs">
    <button id="btn-layer" class="fab fab--text" type="button" aria-label="Switch basemap">AMap</button>
    <button id="btn-list" class="fab" type="button" aria-label="List view" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    </button>
    <button id="btn-locate" class="fab" type="button" aria-label="Show my location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <section id="list" class="list" hidden aria-label="Places list">
    <button id="list-close" class="list__close" type="button">‹ Back to map</button>
    <p id="list-hint" class="list__hint"></p>
    <div id="list-body"></div>
  </section>

  <section id="sheet" class="sheet" hidden aria-live="polite">
    <div class="sheet__grab" aria-hidden="true"></div>
    <button id="sheet-close" class="sheet__close" type="button" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
